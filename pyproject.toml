[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vibe-code-security-checklist"
version = "0.2.0"
description = "ShipReady by Shipmate: zero-dependency pre-launch security checker for Cursor, Lovable, Bolt, Next.js, Supabase, and Stripe apps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Dmitry (Dee) Kargaev", email = "hi@deeflect.com" }]
keywords = ["security", "supabase", "stripe", "nextjs", "lovable", "cursor", "bolt", "checklist", "cli", "sarif", "shipready"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://shipmate.agency"
Repository = "https://github.com/deeflect/vibe-code-security-checklist"
Issues = "https://github.com/deeflect/vibe-code-security-checklist/issues"

[project.scripts]
shipready = "vibe_code_security_checklist:main"
vibe-code-check = "vibe_code_security_checklist:main"
vibe-code-security-checklist = "vibe_code_security_checklist:main"

[tool.hatch.build.targets.wheel]
only-include = []

[tool.hatch.build.targets.wheel.force-include]
"check.py" = "vibe_code_security_checklist.py"

[tool.hatch.build.targets.sdist]
include = ["check.py", "test_check.py", "README.md", "LICENSE", "pyproject.toml"]
